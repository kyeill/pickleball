name: Refresh from DUPR

# Approach B: automated. The DUPR access token (which lasts ~168 days and only
# grants API read access — it is NOT your password) is stored as the DUPR_TOKEN
# repository secret. This job pulls your history daily and commits data.json;
# GitHub Pages redeploys on the push. When the token nears expiry the run prints
# a warning; when it expires the run fails (GitHub emails you) — grab a fresh
# token and update the secret (~twice a year).
on:
  schedule:
    - cron: "0 11 * * *"    # ~6–7am US Eastern
    - cron: "0 15 * * *"    # ~10–11am Eastern — catch-up if GitHub drops the first
  workflow_dispatch:
    inputs:
      token:
        description: "Optional: paste a fresh token for a one-off run. Leave blank to use the stored DUPR_TOKEN secret."
        required: false

permissions:
  contents: write          # commit the refreshed data/data.json back

concurrency:
  group: dupr-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep a pasted one-off token out of the logs (the secret is auto-masked).
      - name: Mask a pasted token
        run: echo "::add-mask::${{ github.event.inputs.token }}"

      - name: Pull history from DUPR
        env:
          # A manual paste wins; otherwise use the stored secret.
          DUPR_TOKEN: ${{ github.event.inputs.token || secrets.DUPR_TOKEN }}
        run: python fetch_dupr.py

      - name: Commit the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No change in data.json."
          else
            git commit -m "Refresh DUPR data: $(date -u +%F)"
            git push
          fi
